<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoopCatch Bridge — Scroll Loop</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --cyan: #00f2fe;
      --blue: #4facfe;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --green: #2ecc71;
      --red: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .cookie-count-box {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .cookie-count-val {
      font-weight: 700;
      color: var(--cyan);
    }
    .cookie-keys {
      font-size: 10.5px;
      color: #64748b;
      line-height: 1.4;
      word-break: break-all;
    }
    .btn-sync {
      width: 100%;
      background: linear-gradient(135deg, var(--cyan), #0072ff);
      color: #090d16;
      border: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.35);
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .btn-sync:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 242, 254, 0.5);
    }
    .btn-sync:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-copy {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .status-msg {
      margin-top: 10px;
      font-size: 11.5px;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      display: none;
      line-height: 1.35;
    }
    .status-msg.success {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: var(--green);
      display: block;
    }
    .status-msg.error {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #ff7675;
      display: block;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
    }
    .footer a {
      color: var(--cyan);
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-dot"></div>
      <div>
        <span class="title">LoopCatch Bridge</span>
        <div style="font-size: 9.5px; color: var(--text-muted); font-weight: 500;">by Scroll Loop • Lahiru_nk</div>
      </div>
    </div>
    <span class="badge">v1.3</span>
  </div>

  <div class="card">
    <div class="cookie-count-box">
      <span>Active Sessions:</span>
      <span class="cookie-count-val" id="cookieCount">Scanning...</span>
    </div>
    <div class="cookie-keys" id="cookieSample">Checking session tokens...</div>
  </div>

  <button class="btn-sync" id="syncBtn">
    <span>⚡ 1-Click Sync to LoopCatch Fleet</span>
  </button>
  
  <button class="btn-copy" id="copyBtn">
    📋 Copy Netscape cookies.txt
  </button>

  <div class="status-msg" id="statusBox"></div>

  <div class="footer">
    <a href="http://127.0.0.1:8899" target="_blank">Open LoopCatch Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
